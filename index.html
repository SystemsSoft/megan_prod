  <script>
    // Captura o evento nativo de instalação do PWA (Android/Chrome/Edge) assim
    // que o navegador dispara — sem isso, ele só apareceria uma vez e sumiria
    // se não fosse tratado. Guardamos em `window.deferredPwaInstallPrompt` pro
    // Dart ler/chamar depois, no bottom sheet de sugestão de instalação (ver
    // lib/services/pwa_install_service.dart). O Chrome só dispara esse evento
    // depois de ~30s de engajamento real do usuário na página (critério de
    // instalabilidade dele) — o app não espera isso: mostra o convite assim
    // que abre, com um diálogo nativo se esse valor já estiver disponível, ou
    // um passo a passo manual caso contrário (ver PwaInstallSheet).
    window.deferredPwaInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      window.deferredPwaInstallPrompt = event;
    });
    window.addEventListener('appinstalled', () => {
      window.deferredPwaInstallPrompt = null;
    });

    // Registra o NOSSO service worker (web/pwa_service_worker.js), e não o
    // `flutter_service_worker.js`: esse último virou uma lápide de migração
    // depois que o Flutter descontinuou o service worker dele
    // (https://github.com/flutter/flutter/issues/156910) — o `activate` dele
    // chama `self.registration.unregister()` e se apaga, então registrá-lo
    // deixava o site permanentemente sem service worker (ciclo
    // installing → installed → activating → redundant).
    //
    // Isso importa porque o Chrome só considera o site instalável com um
    // service worker ativo que tenha handler de `fetch`. Sem ele, o
    // `beforeinstallprompt` acima nunca dispara e a opção "Instalar app" não
    // aparece nem no menu do navegador.
    //
    // O web/flutter_bootstrap.js deste projeto é customizado justamente para
    // o loader do Flutter não registrar a lápide por cima da nossa (os dois
    // disputam o mesmo escopo "/").
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('pwa_service_worker.js').catch((e) => {
          console.warn('Falha ao registrar o service worker:', e);
        });
      });
    }
  </script>
