  <script>
    // Captura o evento nativo de instalação do PWA (Android/Chrome/Edge) assim
    // que o navegador dispara — sem isso, ele só apareceria uma vez e sumiria
    // se não fosse tratado. Guardamos em `window.deferredPwaInstallPrompt` pro
    // Dart ler/chamar depois, no bottom sheet de sugestão de instalação (ver
    // lib/services/pwa_install_service.dart). O Chrome só dispara esse evento
    // depois de ~30s de engajamento real do usuário na página (critério de
    // instalabilidade dele) — o app não espera isso: mostra o convite assim
    // que abre, com um diálogo nativo se esse valor já estiver disponível, ou
    // um passo a passo manual caso contrário (ver PwaInstallSheet).
    window.deferredPwaInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      window.deferredPwaInstallPrompt = event;
    });
    window.addEventListener('appinstalled', () => {
      window.deferredPwaInstallPrompt = null;
    });

    // O loader padrão do Flutter (flutter_bootstrap.js, gerado a cada build)
    // só chama `serviceWorker.register(...)` quando JÁ existe um registro
    // anterior — na primeira visita, sem nenhum registro prévio, ele não
    // registra nada, silenciosamente (comportamento do loader marcado como
    // deprecated pelo próprio Flutter — ver
    // https://github.com/flutter/flutter/issues/156910). Sem service worker
    // ativo, o Chrome nunca considera o site instalável e o
    // `beforeinstallprompt` acima nunca dispara — por isso registramos aqui
    // manualmente, sempre, garantindo que exista um service worker desde a
    // primeira visita.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('flutter_service_worker.js?v=3930862662') /* Flutter's service worker is deprecated and will be removed in a future Flutter release. */.catch((e) => {
          console.warn('Falha ao registrar o service worker:', e);
        });
      });
    }
  </script>
