<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Megan">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Megan">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Cor da barra do navegador (Android) combinando com a identidade escura do app. -->
  <meta name="theme-color" content="#0A1128">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Megan</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Captura o evento nativo de instalação do PWA (Android/Chrome/Edge) assim
    // que o navegador dispara — sem isso, ele só apareceria uma vez e sumiria
    // se não fosse tratado. Guardamos em `window.deferredPwaInstallPrompt` pro
    // Dart ler/chamar depois, no bottom sheet de sugestão de instalação (ver
    // lib/services/pwa_install_service.dart).
    window.deferredPwaInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      window.deferredPwaInstallPrompt = event;
    });
    window.addEventListener('appinstalled', () => {
      window.deferredPwaInstallPrompt = null;
    });
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
